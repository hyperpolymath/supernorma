#
# k9iser manifest for supernorma
# Dev standards tool — Bun/ReScript tool for auditing and enforcing development standards across repos

[project]
name = "supernorma"
safety_tier = "hunt"

[[source]]
path = "package.json"
# NOTE: was "deno" prior to the Bun-first migration (2026-07). k9iser's
# supported source-type enum wasn't verified locally when this was updated
# -- confirm "bun" is recognised, or adjust, the next time k9iser actually
# runs against this manifest.
type = "bun"
output = "generated/k9iser/bun-workspace.k9"

[[source]]
path = "Justfile"
type = "justfile"
output = "generated/k9iser/justfile-recipes.k9"

[[source]]
path = ".github/workflows/hypatia-scan.yml"
type = "workflow"
output = "generated/k9iser/ci-security.k9"

[[constraint]]
rule = "build.dependencies has no banned_packages"
severity = "error"

# The "no npm: specifiers" constraint was removed: under Bun-first, bare
# npm-registry specifiers (e.g. @rescript/runtime) are the normal, desired
# resolution path, not something to forbid.
