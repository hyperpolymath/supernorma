# SPDX-License-Identifier: MPL-2.0
name: ReScript/Deno CI
on:
  push:
    branches: [main, master]
  pull_request:

# Estate guardrail: scope push to default branches so a PR fires once (not
# push+PR), and cancel superseded runs. Safe — read-only PR-triggered check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: ReScript build
        # Note: RSR prefers avoiding npm. This uses pinned versions for reproducibility.
        # Consider switching to esno/Deno-native ReScript tooling when available.
        # ReScript 12 ships the Core stdlib built in, so no @rescript/core dep.
        run: |
          if [ -f "rescript.json" ] || [ -f "bsconfig.json" ]; then
            # Pin to specific version for supply chain security
            npm install --ignore-scripts rescript@12.3.0
            ./node_modules/.bin/rescript build
          fi
      - name: Deno lint
        # src/ and tests/ are ReScript-authored (.res) plus its generated
        # (.res.js) output, which deno.json's lint/fmt config excludes from
        # style checks — machine-generated code shouldn't be lint-policed.
        # That leaves nothing for `deno lint`/`deno fmt` to target today, and
        # both error on an empty target set rather than no-op. Skip cleanly
        # in that case; if a hand-written .js/.ts/.md/etc. file is ever added
        # under src/ or tests/, this re-enables both checks automatically.
        run: |
          if find src tests -type f \( -iname '*.js' -o -iname '*.mjs' -o -iname '*.cjs' -o -iname '*.jsx' \
              -o -iname '*.ts' -o -iname '*.mts' -o -iname '*.cts' -o -iname '*.tsx' -o -iname '*.json' \
              -o -iname '*.jsonc' -o -iname '*.md' -o -iname '*.markdown' -o -iname '*.yml' -o -iname '*.yaml' \) \
              ! -iname '*.res.js' | grep -q .; then
            deno lint
          else
            echo "No hand-written lintable files under src/ or tests/ (project is ReScript-authored); skipping deno lint."
          fi
      - name: Deno fmt check
        run: |
          if find src tests -type f \( -iname '*.js' -o -iname '*.mjs' -o -iname '*.cjs' -o -iname '*.jsx' \
              -o -iname '*.ts' -o -iname '*.mts' -o -iname '*.cts' -o -iname '*.tsx' -o -iname '*.json' \
              -o -iname '*.jsonc' -o -iname '*.md' -o -iname '*.markdown' -o -iname '*.yml' -o -iname '*.yaml' \) \
              ! -iname '*.res.js' | grep -q .; then
            deno fmt --check
          else
            echo "No hand-written formattable files under src/ or tests/ (project is ReScript-authored); skipping deno fmt --check."
          fi
      - name: Deno test
        run: deno test --allow-all --coverage=coverage
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: Check permissions
        run: |
          # Audit for dangerous permissions
          grep -rE "allow-run|allow-write|allow-env" . || echo "No dangerous permissions"
