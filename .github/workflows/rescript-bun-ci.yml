# SPDX-License-Identifier: MPL-2.0
name: ReScript/Bun CI
on:
  push:
    branches: [main, master]
  pull_request:

# Estate guardrail: scope push to default branches so a PR fires once (not
# push+PR), and cancel superseded runs. Safe — read-only PR-triggered check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - name: Install dependencies
        run: bun install --ignore-scripts
      - name: ReScript build
        # ReScript 12 ships the Core stdlib built in (no @rescript/core dep).
        # Bun resolves @rescript/runtime natively via node_modules -- unlike
        # Deno, which needed an explicit import-map entry that was missing.
        run: bun run build
      - name: Bun test
        # See package.json's "test" script: bun test only auto-discovers
        # files whose name literally ends in .test./_test_./.spec. -- never
        # true for ReScript's generated *_test.res.js output (the compiler
        # always appends .res.js verbatim). Explicit ./-prefixed file paths
        # bypass that convention filter; the script builds that list.
        run: bun run test
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check for risky patterns
        # Bun has no Deno-style --allow-* permission flags to audit.
        # Informational only (matches the prior Deno-era job's behaviour):
        # flags common npm/JS supply-chain risk patterns for review, does
        # not fail the build.
        run: |
          grep -rE "eval\(|child_process|postinstall" --include="*.res" --include="*.js" --include="package.json" . || echo "No risky patterns found"
