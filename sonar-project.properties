sonar.projectKey=hyperpolymath_supernorma
sonar.organization=hyperpolymath

# ReScript compiles to JS with the *.res.js suffix (see rescript.json). That
# output is machine-generated -- do not scan it for duplication/style/etc.
# It shares ReScript's compiler boilerplate across every module (the same
# import block, the same wrapper shape), which otherwise reads as high
# duplication on a code style SonarCloud was never meant to police. The
# *.res source is the real, human-authored code and stays in scope.
sonar.exclusions=**/*.res.js,node_modules/**,lib/**
